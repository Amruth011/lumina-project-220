name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: esjzitabjftwiqjzjttw
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy functions
        run: |
          set -e
          for fn in analyze compare-resume cover-letter decode-jd generate-bullet generate-resume parse-resume-file tailor-resume generate-roadmap embed; do
            echo "Deploying $fn..."
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
          done
          echo "Deploying diagnose (no JWT)..."
          supabase functions deploy diagnose --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
