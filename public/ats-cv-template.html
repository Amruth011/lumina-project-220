<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Helvetica', 'Arial', sans-serif; font-size: 11px; line-height: 1.5; color: #1a1a2e; background: #fff; padding: 15mm 12mm; }
  .header { margin-bottom: 14px; }
  .header h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 2px; }
  .header-line { height: 2px; background: #222; margin-bottom: 6px; }
  .contact { font-size: 10px; color: #555; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .contact a { color: #2a5c8a; text-decoration: none; }
  .section { margin-bottom: 12px; }
  .section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #ccc; padding-bottom: 2px; margin-bottom: 6px; }
  .summary-text { font-size: 10.5px; line-height: 1.6; color: #222; margin-bottom: 4px; }
  .comp-grid { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-bottom: 4px; }
  .comp-tag { font-size: 9.5px; background: #f0f0f0; padding: 2px 7px; border-radius: 2px; }
  .item { margin-bottom: 8px; }
  .item-header { font-weight: 700; font-size: 11px; }
  .item-sub { font-size: 10px; color: #555; margin-bottom: 2px; }
  .item ul { padding-left: 16px; margin-top: 2px; }
  .item li { font-size: 10px; line-height: 1.5; margin-bottom: 2px; }
  .skills-line { font-size: 10px; margin-bottom: 2px; }
  .skills-line strong { font-weight: 600; }
  @media print { body { padding: 0; } }
</style>
</head>
<body>
  <div class="header">
    <h1>{{NAME}}</h1>
    <div class="header-line"></div>
    <div class="contact">{{CONTACTS}}</div>
  </div>

  {{SUMMARY_SECTION}}

  {{COMPETENCIES_SECTION}}

  {{EXPERIENCE_SECTION}}

  {{PROJECTS_SECTION}}

  {{EDUCATION_SECTION}}

  {{SKILLS_SECTION}}
</body>
</html>
